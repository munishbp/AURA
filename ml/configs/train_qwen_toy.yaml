# Workstream 4 toy task: train an "add eyeglasses" LoRA on ~a dozen synthetic pairs.
# Goal: prove the loop works, prove the eval harness picks up the change, prove
# the 5090 doesn't OOM at 768px batch 1. NOT a meaningful procedure LoRA.
#
# Build the dataset first (synthetic pair curation over data/raw/faces), then:
#   uv run python -m aura_ml.training.train --config configs/train_qwen_toy.yaml

dataset_root: data/pairs/toy_glasses
resolution: 768

base_model_id: Qwen/Qwen-Image-Edit-2511
quantize_4bit: true

rank: 16            # smaller than the procedure recipe — toy task
alpha: 32
dropout: 0.1
# QwenImageTransformer2DModel block modules: attention (image + text streams)
# and both MLPs.
target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
  - add_q_proj
  - add_k_proj
  - add_v_proj
  - to_add_out
  - img_mlp.net.0.proj
  - img_mlp.net.2
  - txt_mlp.net.0.proj
  - txt_mlp.net.2

learning_rate: 1.0e-4
lr_min: 1.0e-6
weight_decay: 0.01
optimizer: adamw_8bit
timestep_sampling: logit_normal

epochs: 40          # toy task — convergence quick
batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
mixed_precision: bf16
max_grad_norm: 1.0

output_dir: outputs/toy_glasses
save_every_epochs: 10
eval_every_epochs: 5
# Held-out faces + GLASSES instructions (built by scripts/run_toy_e2e.sh) —
# the LoRA is judged on its own task, not the surgical holdout.
eval_holdout_dir: data/pairs/toy_glasses_holdout
eval_num_steps: 20
eval_true_cfg_scale: 4.0
eval_max_samples: 6

seed: 0
